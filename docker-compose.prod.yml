# Photon Ledger – production (e.g. on the NAS): pulls the published image, never builds.
#
# Needed on the NAS: only this file and .env (from .env.example) in one folder, no source code.
#
#   mkdir -p data
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Update:   docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
# (or copy this file as docker-compose.yml, then the -f option is not needed)
#
#   ARCHIVE_PATH      your image archive, mounted read-only
#   ./data            database (SQLite), thumbnails – bind mount on the host, no docker volume
#   PHOTONLEDGER_TAG  image version: latest (main), a release like 1.2.0, or sha-<commit>

x-photonledger: &photonledger
  image: ghcr.io/trickx/photonledger:${PHOTONLEDGER_TAG:-latest}
  pull_policy: missing               # never build; "docker compose pull" fetches updates
  user: "${PUID:-1000}:${PGID:-1000}"
  restart: unless-stopped
  volumes:
    - ${ARCHIVE_PATH:-/share/Multimedia/Astro}:/archive:ro
    - ./data:/data
  env_file: .env

services:
  web:
    <<: *photonledger
    container_name: photonledger-web
    ports:
      - "${PORT:-5080}:5080"
    environment:
      RUNWEB: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5080/healthz')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  indexer:
    <<: *photonledger
    container_name: photonledger-indexer
    environment:
      RUNINDEXER: "true"
    depends_on:
      web:
        condition: service_healthy     # web has migrated the database
